[package]
name = "myusic"
version = "1.0.0"
description = "Lightweight transparent Apple Music overlay"
edition = "2021"

[lib]
name = "myusic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
dirs = "6"

[dependencies.windows]
version = "0.58"
features = [
    "Media_Control",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections",
]
